
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | SecureAuth Lab</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 50px 24px;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #f1f5f9;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 36px;
            background: #121a2e;
            border: 1px solid #29334b;
            border-radius: 18px;
            box-shadow: 0 20px 60px #0005;
        }

        .logo { font-size: 27px; font-weight: bold; }
        .logo span { color: #a78bfa; }

        h2 { margin-top: 32px; }

        p {
            color: #a8b2c8;
            line-height: 1.8;
        }

        .status {
            margin: 24px 0;
            padding: 18px;
            border: 1px solid #245642;
            border-radius: 12px;
            background: #10271f;
            color: #86efac;
        }

        button {
            padding: 13px 22px;
            border: 0;
            border-radius: 9px;
            background: #8b5cf6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #7c3aed; }
    </style>
</head>
<body>
    <main>
        <div class="logo">Secure<span>Auth</span> Lab</div>

        <h2>Welcome, {{ username }}!</h2>

        <div class="status">
            <strong>Authenticated session active</strong>
        </div>

        <p>
            You are signed in to your SecureAuth Lab demo account.
        </p>

        <p>
            The application is configured with a 15-minute
            permanent session lifetime.
        </p>

        <form action="{{ url_for('logout') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Log Out</button>
        </form>
    </main>
</body>
</html>
